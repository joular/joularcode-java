# Joular Code - Java: Configuration
#
# Power source type
# Options:
#   ringbuffer (read from the shared memory ring buffer PowerJoular writes with -r)
#   csv (read from the CSV file PowerJoular writes with -f or -o)
#   rapl (read from RAPL on Linux directly, without PowerJoular)
# Default if left empty: ringbuffer
power-source-type=

# Path to the PowerJoular CSV file (if power-source-type is csv)
# This must be the file holding the power of the whole system, not the one PowerJoular writes for a monitored process
# Default if left empty: powerjoular-data.csv (relative to working directory)
powerjoular-csv-path=

# Path to the ring buffer (if power-source-type is ringbuffer)
# Default if left empty (OS-dependent):
#   Linux:   /dev/shm/joularcorering
#   macOS:   /tmp/joularcorering
#   Windows: %PROGRAMDATA%\\joularcorering
powerjoular-ringbuffer-path=

# The sample rate (milliseconds) for the agent to monitor methods usage
# by calling the JVM stack
# Higher count means less accurate energy data
# Lower count means higher overhead of the agent
# Default if left empty: 10 (good balance between accuracy and efficiency)
stack-monitoring-sample-rate=

# Output folder for results
# Default if left empty: joular-code-java-results
results-path=

# Prefix to filter monitoring of methods
# If set, only methods where their full canonical name (package.class.method) starting with this prefix will be monitored
# If not set, all observed branches appear in both output files.
# Example: methods-filtering-prefix=com.example to filter energy for all methods whose full name start with com.example
# Note that Joular Code Java will always generate energy for all non-filtered methods in a separate file
# You can add multiple identifiers names separated by a comma, ordered by priority
# Example: methods-filtering-prefix=com.example,org.myapp
# Default if left empty: no filter (all branches go to both output files)
methods-filtering-prefix=
